prefix: "&#FF0055ETNT &7» &f"

no-permission: "[message]{prefix}&cУ вас нет прав для использования этой команды!"
only-player: "[message]{prefix}&cТолько игрок может использовать эту команду!"
player-offline: "[message]{prefix}&cИгрок &e%player% &cсейчас не в сети!"
unknown-type: "[message]{prefix}&cНеизвестный тип TNT: &e%type%&c. Доступно: &7%available%"
invalid-amount: "[message]{prefix}&cНеверное количество! Должно быть от 1 до 64"
usage-give: "[message]{prefix}&cИспользование: &7/tnt give <ник> <тип> <кол-во>"

help:
  - "[message]&8&m----------&r &#FF0055ETNT &8&m----------"
  - "[message]&f/tnt give &8<&fник&8> <&fтип&8> <&fкол-во&8> &8- &7выдать TNT"
